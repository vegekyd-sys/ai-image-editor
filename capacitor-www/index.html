<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Makaron</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .brand {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div class="brand">Makaron</div>
    <script>
      window.Capacitor?.Plugins?.SplashScreen?.hide?.().catch?.(() => {});
      window.location.replace('https://www.makaron.app/');
    </script>
  </body>
</html>
