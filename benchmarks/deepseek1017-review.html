<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek 1017 × Luna · TikTok 实测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#20251f;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:1180px;margin:auto;padding:40px 28px}h1{font-size:34px;line-height:1.2;margin:8px 0 18px;letter-spacing:-1px}h2{font-size:23px;margin:0}.eyebrow{letter-spacing:2px;font-size:11px;color:#697562}.intro{max-width:850px;color:#60695c}.stats{display:flex;gap:28px;margin:26px 0}.stats strong{font-size:25px;display:block}section{background:white;border:1px solid #dedfd7;border-radius:14px;padding:24px;margin:24px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.source{color:#737c6d;font-size:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}.label{font-size:17px;font-weight:650}.metrics{font-size:12px;color:#626e5d;min-height:38px}.screen{background:#191d19;display:flex;justify-content:center;align-items:center;min-height:320px;border-radius:9px;overflow:hidden;color:#bfc9b9}video{width:100%;max-height:540px;display:block;background:#141714}button,a{font:inherit}button{border:1px solid #cdd4c6;background:#eff2e8;color:#30432b;border-radius:7px;padding:7px 13px;cursor:pointer}a{color:#405c35}.links{font-size:12px;margin-top:8px;display:flex;gap:14px}.status{color:#ad6036}details{margin-top:12px;font-size:12px;color:#75816c}summary{cursor:pointer}pre{white-space:pre-wrap;font:inherit}.qa{font-size:12px;color:#4a6240;margin-top:8px}.controls{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:30px}.summary{font-size:13px;color:#65715c}footer{font-size:12px;color:#6b7564;margin-top:32px}@media(max-width:650px){main{padding:25px 14px}section{padding:16px}.pair{gap:9px}.label{font-size:13px}.screen{min-height:200px}.metrics{font-size:11px}h1{font-size:27px}.head{display:block}.controls{margin-top:10px}}
</style><main><div class="eyebrow">MAKARON · REAL TASK BENCHMARK · 2026.10.17</div><h1>DeepSeek 1017 × 默认 Luna</h1><p class="intro">5 个真实客户，5 对 60 秒 TikTok。同一题的原始素材和任务完全相同。先看实际成片，再比较速度与完成情况。</p><div class="stats" id="stats"></div><p class="summary" id="summary"></p><div id="cases"></div><footer id="footer"></footer></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':`${Math.floor(n/60)}分${Math.round(n%60)}秒`;
let previous='';
async function update(){const d=await fetch('data.json?t='+Date.now()).then(r=>r.json());const signature=JSON.stringify(d.rows.map(r=>r.models.map(m=>[m.status,m.video_url,m.credits,m.qa])));const done=d.rows.flatMap(r=>r.models).filter(m=>m.video_url).length;document.querySelector('#stats').innerHTML=`<div><strong>${done} / 10</strong>已有 MP4</div><div><strong>${d.rows.reduce((a,r)=>a+(r.clip_count||0),0)}</strong>真实素材范围</div><div><strong>${d.budget?.credits_settled??d.rows.flatMap(r=>r.models).reduce((a,m)=>a+(m.credits||0),0)}</strong>实验已结算 Credits</div>`;document.querySelector('#summary').textContent=d.notes;document.querySelector('#footer').textContent='更新于 '+new Date(d.generated_at).toLocaleString()+' · 10条当前交付均已完整解码、抽帧检查并测量响度；完整连续听审仍需人工评审。';for(const r of d.rows){const fields=document.querySelectorAll(`#case-${r.id} .metrics`);r.models.forEach((m,i)=>{if(fields[i])fields[i].innerHTML=`<span class="status">${esc(m.status)}${m.recovery?' · 含后续修正/接续':''}</span> · ${m.recovery?'含修正累计':'首片'} ${fmt(m.seconds)} · ${m.credits??'待结算'} Credits`;});}if(signature===previous)return;const playing=[...document.querySelectorAll('video')].some(v=>!v.paused);if(playing)return;previous=signature;document.querySelector('#cases').innerHTML=d.rows.map(r=>`<section id="case-${r.id}"><div class="head"><div><div class="eyebrow">PAIR ${r.id}</div><h2>${esc(r.name)}</h2><div class="source">${r.clip_count||'—'} 段 · 来源 ${r.source_seconds?.toFixed(1)||'—'} 秒 · Scene 检索 ${fmt(r.retrieval_seconds)}</div></div><div class="controls"><button onclick="both('${r.id}',true)">同步从头播放</button><button onclick="both('${r.id}',false)">全部暂停</button></div></div><div class="pair">${r.models.map((m,i)=>`<article><div class="label">${esc(m.label)}</div><div class="metrics"><span class="status">${esc(m.status)}${m.recovery?' · 含后续修正/接续':''}</span> · ${m.recovery?'含修正累计':'首片'} ${fmt(m.seconds)} · ${m.credits??'待结算'} Credits</div>${m.recovery?`<div class="source">首版：${m.first_seconds?fmt(m.first_seconds):'未交付'} · ${m.corrected?'主播放器为后续版本':'主播放器保留首版，修正中'}</div>`:''}<div class="screen">${m.video_url?`<video controls playsinline preload="metadata" ${m.qa.duration?`poster="${esc(m.poster_url)}"`:''} src="${esc(m.video_url)}"></video>`:`<div class="empty">制作中<br>最终 MP4 尚未交付</div>`}</div><div class="links">${m.video_url?`<button onclick="listen('${r.id}',${i})">听这一版</button>`:''}${m.project_url?`<a target="_blank" href="${esc(m.project_url)}">打开可编辑项目 ↗</a>`:''}${m.video_url?`<a target="_blank" href="${esc(m.video_url)}">${m.corrected?'修正版 MP4':'首版 MP4'} ↗</a>`:''}${m.recovery&&m.first_video_url&&m.corrected?`<a target="_blank" href="${esc(m.first_video_url)}">保留的首版 ↗</a>`:''}</div>${m.qa.duration?`<div class="qa">${m.qa.duration.toFixed(3)} 秒 · ${m.qa.width}×${m.qa.height} · ${m.qa.decode_ok?'完整解码通过':'待核验'} · ${m.qa.audio_streams} 音轨 · ${m.qa.integrated_lufs??'—'} LUFS</div>`:''}${m.qa.visual_review?.startsWith('FAIL')?'<div class="status">实帧已确认画面空档，修正中；此首版保留供对照。</div>':''}<details><summary>运行记录</summary><pre>${esc(m.run_id)}\n${esc(m.actual_models.join(', '))}\n${esc(m.last_message)}</pre></details></article>`).join('')}</div></section>`).join('');}
function listen(id,index){for(const v of document.querySelectorAll('video'))v.muted=true;const chosen=document.querySelectorAll(`#case-${id} video`)[index];if(chosen)chosen.muted=false;}
async function both(id,play){if(play)for(const v of document.querySelectorAll('video'))v.pause();const vs=[...document.querySelectorAll(`#case-${id} video`)];for(const v of vs){v.pause();if(play){v.currentTime=0;v.muted=false;}}if(play){if(vs[1])vs[1].muted=true;await Promise.all(vs.map(v=>v.play().catch(()=>{})));}}
update();setInterval(update,15000);
</script></html>
