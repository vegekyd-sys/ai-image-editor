<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二轮 · DeepSeek × Luna 创作对比</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202023;background:#f7f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:48px 28px}a{color:#654078;text-decoration:none}h1{font-size:38px;letter-spacing:-1px;margin:14px 0}h2{font-size:23px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#8a747a}p{line-height:1.7;color:#696067}.stats{display:flex;gap:18px;margin:28px 0;flex-wrap:wrap}.stats div{padding:18px 24px;background:#fff;border:1px solid #e6dfda;border-radius:12px}.stats strong{display:block;font-size:25px}.nav{display:flex;gap:20px;margin:28px 0;flex-wrap:wrap}.nav a{border-bottom:1px solid #bb95bd;padding-bottom:5px}section{background:#fff;border:1px solid #e4ded8;border-radius:18px;padding:26px;margin:24px 0}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.label{font-weight:600}.metrics,.qa{font-size:12px;color:#777;margin:9px 0;line-height:1.65}.screen{background:#121116;border-radius:10px;overflow:hidden;display:flex;justify-content:center;min-height:180px}.screen video,.screen img{display:block;max-width:100%;max-height:650px;object-fit:contain}.empty{padding:70px 15px;color:#b0a7b0;text-align:center}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:12px}button{border:1px solid #ddd4df;background:#f7f2f8;color:#604365;border-radius:7px;padding:8px 11px;cursor:pointer}details{font-size:12px;margin-top:16px;color:#777}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 monospace}footer{margin:36px 0;color:#888;font-size:12px}article{min-width:0}.timing{overflow-x:auto;margin:20px 0 34px}table{border-collapse:collapse;width:100%;font-size:13px;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6dfda;line-height:1.6}th{font-size:11px;color:#777}.kind{color:#9a6e90;font-size:12px}.theme{font-size:13px;max-width:900px} @media(max-width:650px){main{padding:26px 12px}h1{font-size:28px}section{padding:14px}.pair{gap:9px}.label{font-size:12px}.head{display:block}.head button{margin-top:10px}.screen video,.screen img{max-height:420px}}
</style><main><a href="../">← 第一轮10条成片</a><div class="eyebrow" style="margin-top:24px">MAKARON · ROUND TWO · ACTUAL OUTPUTS</div><h1>再做一轮，看它能走多远。</h1><p>5 组客户 TikTok，2 组 15 秒 mascot 生成视频，3 组品牌图片。左侧 DeepSeek，右侧 Luna。</p><div class="stats" id="stats"></div><p id="notes"></p><nav class="nav"><a href="#case-06">60 秒 TikTok</a><a href="#case-V1">15 秒生成视频</a><a href="#case-I1">Mascot 图片</a><a href="local-stage/">本地受阻阶段归档 ↗</a></nav><div id="timing" class="timing"></div><div id="cases"></div><footer id="footer"></footer></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'待完成':`${Math.floor(n/60)}分${Math.round(n%60)}秒`;let signature='';
async function update(){const d=await fetch('data.json?t='+Date.now()).then(r=>r.json());const all=d.rows.flatMap(r=>r.models);document.querySelector('#stats').innerHTML=`<div><strong>${all.filter(m=>m.url).length} / 20</strong>已有产物，验收另列</div><div><strong>${d.budget.credits_settled} Credits</strong>本轮已结算 / 3000上限</div><div><strong>${all.filter(m=>m.qa.decode_ok||m.qa.image_ok).length}</strong>实际文件已检查</div>`;document.querySelector('#notes').textContent=d.notes;document.querySelector('#timing').innerHTML=`<p><a href="timings.csv" download>下载完整计时表 CSV ↓</a> · 首轮最终导出包括 Agent 自主修订，宿主修复单列。</p><table><thead><tr><th>客户</th><th>Flash 首轮最终MP4</th><th>Luna 首轮最终MP4</th><th>额外修复</th></tr></thead><tbody>${d.rows.filter(r=>r.kind==='tiktok').map(r=>`<tr><td><a href="#case-${r.id}">${esc(r.name)}</a></td><td>${fmt(r.models[0].final_seconds)}</td><td>${fmt(r.models[1].final_seconds)}</td><td>${r.models[0].repair_total_seconds?'Flash黑帧修复：从原始提交 '+fmt(r.models[0].repair_total_seconds)+'（含宿主复核等待）':'—'}</td></tr>`).join('')}</tbody></table>`;document.querySelector('#footer').textContent='更新于 '+new Date(d.generated_at).toLocaleString()+' · 生成完成、文件检查、视觉/听感验收分别记录。';const next=JSON.stringify(d.rows);if(next===signature||[...document.querySelectorAll('video')].some(v=>!v.paused))return;signature=next;document.querySelector('#cases').innerHTML=d.rows.map(r=>`<section id="case-${r.id}"><div class="head"><div><div class="kind">${{tiktok:'60s · SCENE 客户实拍',video:'15s · MASCOT 生成视频',image:'MASCOT · 图片生成'}[r.kind]}</div><h2>${esc(r.id)} · ${esc(r.name)}</h2></div>${r.kind!=='image'?`<div><button onclick="both('${r.id}',true)">同步从头播放</button> <button onclick="both('${r.id}',false)">暂停</button></div>`:''}</div><p class="theme">${esc(r.theme)}</p>${r.clip_count?`<div class="metrics">共用素材 ${r.clip_count} 段 / ${r.source_seconds.toFixed(1)} 秒 · Scene检索 ${fmt(r.seconds)}</div>`:''}<div class="pair">${r.models.map((m,i)=>`<article><div class="label">${esc(m.label)}</div><div class="metrics">${esc(m.status)} · ${m.formal?'正式首个成片':m.recovery?'累计含恢复':'首次产物'} ${fmt(m.seconds)} · ${m.credits??'待结算'} Credits</div><div class="screen">${m.url?(r.kind==='image'?`<img src="${esc(m.display_url||m.url)}" alt="${esc(r.name+' '+m.label)}" loading="lazy">`:`<video controls playsinline preload="metadata" src="${esc(m.display_url||m.url)}"></video>`):'<div class="empty">等待正式产物<br>早期本地尝试已另存归档</div>'}</div><div class="links">${m.url?`<a href="${esc(m.url)}" target="_blank">打开原始产物 ↗</a>`:''}${m.revision_url?`<a href="${esc(m.revision_display_url||m.revision_url)}" target="_blank">Agent自主修订版 · 总用时${fmt(m.final_seconds)} ↗</a>`:''}${m.repair_url?`<a href="${esc(m.repair_display_url||m.repair_url)}" target="_blank">黑帧修复版 · 从原始提交${fmt(m.repair_total_seconds)} / 追加制作${fmt(m.repair_seconds)} / ${m.repair_credits??'待结算'} Credits ↗</a>`:''}${m.project_url?`<a href="${esc(m.project_url)}" target="_blank">可编辑项目 ↗</a>`:''}${m.url&&r.kind!=='image'?`<button onclick="listen('${r.id}',${i})">听这一版</button>`:''}</div><div class="qa">${m.final_seconds?'最终MP4导出 '+fmt(m.final_seconds)+'<br>':''}${m.running_seconds?'Agent进行中 · 已用 '+fmt(m.running_seconds)+'<br>':''}${(m.agent_seconds??m.terminal_seconds)?'Agent结束 '+fmt(m.agent_seconds??m.terminal_seconds)+'<br>':''}${m.timing_source==='server_image_event'?'采用服务端图片生成事件时间<br>':''}${m.timing_source==='server_export_completed'?'采用服务端MP4导出完成时间 · 渲染 '+fmt(m.render_seconds)+'<br>':''}${m.polling_uncertainty_seconds?'首个产物观察区间误差 ≤ '+m.polling_uncertainty_seconds.toFixed(1)+'s<br>':''}${m.host_intervention?.action?esc('宿主干预：成片验收后停止重复等待')+'<br>':''}${m.qa.duration?`${m.qa.duration.toFixed(3)}s · ${m.qa.width}×${m.qa.height} · ${m.qa.decode_ok?'完整解码通过':'待检查'} · ${m.qa.integrated_lufs??'—'} LUFS`:m.qa.image_ok?`${m.qa.width}×${m.qa.height} · 图片文件可解码`:'文件与视觉验收待完成'}${m.qa.visual_review?'<br>'+esc(m.qa.visual_review):''}${m.repair_qa?.visual_review?'<br>修复版：'+esc(m.repair_qa.visual_review):''}</div><details><summary>实际模型与运行记录</summary><pre>${esc(m.run_id)}\n${esc(m.actual_models.join(', '))}\n${esc(m.text)}</pre></details></article>`).join('')}</div></section>`).join('');}
function listen(id,i){document.querySelectorAll('video').forEach(v=>v.muted=true);const v=document.querySelectorAll(`#case-${id} article`)[i]?.querySelector('video');if(v)v.muted=false;}
async function both(id,play){document.querySelectorAll('video').forEach(v=>v.pause());const vs=[...document.querySelectorAll(`#case-${id} video`)];if(play){vs.forEach((v,i)=>{v.currentTime=0;v.muted=i>0});await Promise.all(vs.map(v=>v.play().catch(()=>{})));}}
update();setInterval(update,15000);
</script></html>
