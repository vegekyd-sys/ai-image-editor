project_id = "makaron-ios-subscription-e2e"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seeds/seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.images]
public = true
file_size_limit = "20MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/json", "application/zip", "text/markdown", "text/plain"]

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3002"
additional_redirect_urls = ["http://127.0.0.1:3002/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.rate_limit]
email_sent = 100
sms_sent = 1
anonymous_users = 1
token_refresh = 500
sign_in_sign_ups = 500
token_verifications = 500
web3 = 1

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Makaron E2E verification code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Makaron E2E verification code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.recovery]
subject = "Makaron E2E recovery code"
content_path = "./supabase/templates/otp.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
