name: Makaron App CI

on:
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'services/google-subscription-extension/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run __tests__/createProjectUpload.test.ts
      - name: Video subscription routing and accounting
        run: npx vitest run __tests__/geminiVideoSubscription.test.ts __tests__/geminiVideoBilling.test.ts __tests__/videoMcpBilling.test.ts __tests__/videoAnalysis.test.ts __tests__/billingAttribution.test.ts __tests__/billing.test.ts __tests__/flashUnderstanding.test.ts __tests__/googleRelayAuthorization.test.ts __tests__/googleRelayIdentity.test.ts __tests__/personalSubscriptionAdmin.test.ts __tests__/personalSubscriptionAdminRoute.test.ts __tests__/personalSubscriptionAdminUi.test.tsx __tests__/agentNativeVision.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Google Relay extension contracts
        run: |
          python -m pip install -r services/google-subscription-extension/requirements.txt
          python -m unittest discover -s services/google-subscription-extension -p 'test_*.py'
