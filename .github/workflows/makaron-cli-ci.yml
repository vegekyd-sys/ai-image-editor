name: Makaron CLI CI

on:
  pull_request:
    paths:
      - 'packages/makaron-cli/**'
      - 'scripts/lint-customer-docs.mjs'
      - '__tests__/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/makaron-cli-ci.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run isolated live Makaron CLI smoke'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mock-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:cli
      - run: pnpm run lint:agent-docs
      - run: pnpm run lint:customer-docs

  live-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/makaron-cli run test:live
        env:
          MAKARON_LIVE: '1'
          MAKARON_API_KEY: ${{ secrets.MAKARON_LIVE_API_KEY }}
          MAKARON_URL: ${{ secrets.MAKARON_LIVE_URL }}
