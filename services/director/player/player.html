<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makaron Director</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141315;color:#fff;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px}header,form,footer{display:flex;gap:10px;align-items:center}header{justify-content:space-between;margin-bottom:14px}h1{margin:0;font-size:20px}video{width:100%;aspect-ratio:16/9;background:#242226;display:block;object-fit:contain;border-radius:12px}input,button,a{font:inherit}input,button{border:0;border-radius:8px;padding:9px 12px}input{flex:1;min-width:0}button{cursor:pointer}button:disabled{opacity:.5}footer{flex-wrap:wrap;margin-top:10px}a{color:#ffd3ae}body.embedded main{padding:0}.embedded header,.embedded form,.embedded footer{display:none}.embedded #status{position:absolute;bottom:4px;left:10px;background:#171717bd;padding:4px;border-radius:5px;font-size:12px}.embedded video{height:100vh;border-radius:0}
</style>
<main><header><h1>Makaron Director</h1><button id="stop">结束直播</button></header><video autoplay muted playsinline aria-label="直播画面"></video><p role="status" id="status">正在准备第一幕…</p>
<form><input id="direction" maxlength="6000" aria-label="下一幕" placeholder="下一幕发生什么？"><button>发送</button></form>
<footer><button id="mic" hidden>语音导演</button><button id="sound">开启声音</button><button id="still">留一帧</button><a id="save" hidden>保存录像</a></footer></main>
<script type="module" src="./player.js"></script></html>
