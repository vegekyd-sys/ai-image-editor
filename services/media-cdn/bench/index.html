<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makaron 下载候选验收</title>
<style>body{font:16px system-ui;max-width:900px;margin:64px auto;padding:24px;background:#f5f5f3;color:#222}h1{font-size:32px}label{display:block;margin:20px 0}input,select,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px}input{width:95%}button{background:#242424;color:white;cursor:pointer;margin-right:10px}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:12px}small{color:#666}</style>
<h1>Makaron 下载候选验收</h1><p>使用编辑器候选版的同一下载模块。文件保持原始字节；显示速度、校验值和实际传输模式。</p>
<label>公开媒体 URL<input id="url" type="url" aria-label="公开媒体 URL"></label>
<label>下载方式 <select id="mode"><option value="parallel">四路分段</option><option value="single">单路完整请求</option></select></label>
<button id="start">下载并校验</button><button id="cancel" disabled>取消</button><pre id="result">等待测试</pre><a id="save" hidden>保存校验后的文件</a>
<script type="module">
import { fetchDownload } from '../../../src/lib/parallel-download.ts';
const input=document.querySelector('#url'),start=document.querySelector('#start'),cancel=document.querySelector('#cancel'),result=document.querySelector('#result'),save=document.querySelector('#save');
let controller, objectUrl;
input.value=new URL(location.href).searchParams.get('url')||'';
cancel.onclick=()=>controller?.abort();
start.onclick=async()=>{
  controller=new AbortController();start.disabled=true;cancel.disabled=false;save.hidden=true;
  let requests=0, ranges=0, bytes=0;const began=performance.now();
  const fetcher=async(url,init={})=>{requests++;if(new Headers(init.headers).has('Range'))ranges++;return fetch(url,init)};
  try{
    const response=document.querySelector('#mode').value==='parallel'?await fetchDownload(input.value,undefined,{signal:controller.signal,fetcher}):await fetcher(input.value,{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const reader=response.body.getReader(),parts=[];
    for(;;){const {value,done}=await reader.read();if(done)break;parts.push(value);bytes+=value.byteLength;result.textContent=`已下载 ${(bytes/1e6).toFixed(1)} MB · ${((performance.now()-began)/1000).toFixed(1)} 秒`;}
    const seconds=(performance.now()-began)/1000,blob=new Blob(parts,{type:response.headers.get('content-type')||'video/mp4'});
    const hash=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());
    const sha256=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');
    result.textContent=JSON.stringify({bytes,seconds,MBps:bytes/1e6/seconds,requests,rangeRequests:ranges,sha256},null,2);
    if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);save.href=objectUrl;save.download='makaron-download-candidate.mp4';save.hidden=false;
  }catch(error){result.textContent=error.name==='AbortError'?'已取消':String(error)}finally{start.disabled=false;cancel.disabled=true;}
};
</script></html>
