<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>音乐供应商盲听对比 2026-11</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e4e2dc;--acc:#2f5bd3}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9890;--line:#2c2b28;--acc:#8aa8ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"PingFang SC",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:36px 0 6px}
.mut{color:var(--mut);font-size:13px}.prompt{border-left:3px solid var(--line);padding:4px 12px;color:var(--mut);font-size:13px;margin:8px 0 14px}
.row{display:grid;grid-template-columns:44px 1fr 300px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lab{font-weight:600;font-size:18px}.name{font-weight:600}.hide .name,.hide .meta{display:none}.hide .blind{display:inline}.blind{display:none;color:var(--mut)}
audio{width:300px;height:36px}button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}select{font:inherit;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0}
</style></head><body><main>
<h1>音乐供应商盲听对比</h1>
<div class="mut">2026-11-06 · 两个 prompt × 7 个模型 + EvoLink Suno 渠道，都要求 30 秒、纯音乐 · 默认盲听（名字隐藏、顺序打乱）</div>
<div class="bar"><button id="tog">揭晓供应商</button><button id="shuf">重新打乱</button><span class="mut">每条可以给 1–5 分，揭晓后可对照 Gemini 的盲评分（仅供参考）</span></div>
<div id="root" class="hide"></div>
<script>
const DATA={"p1": {"title": "Prompt 1 · Lo-fi house 旅行 vlog", "prompt": "Uplifting cinematic lo-fi house background music for a 30-second travel vlog: warm Rhodes chords, soft side-chained kick, plucked acoustic guitar hook, airy pads, gentle build into a bright drop around 15 seconds, clean ending. Instrumental, no vocals, 110 BPM.", "tracks": [{"file": "audio/p1_elevenlabs-v2.5_1.mp3", "key": "elevenlabs-v2.5", "name": "ElevenLabs Music v2.5", "via": "fal", "price": "$0.30/30s (fal)", "dur": 30.0, "score": 4.17}, {"file": "audio/p1_evolink-suno-v6-mini_1.mp3", "key": "evolink-suno-v6-mini", "name": "Suno V6 Mini", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 30.0, "score": 5.5}, {"file": "audio/p1_evolink-suno-v6-mini_2.mp3", "key": "evolink-suno-v6-mini", "name": "Suno V6 Mini", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 30.0, "score": 6.41}, {"file": "audio/p1_evolink-suno-v6_1.mp3", "key": "evolink-suno-v6", "name": "Suno V6", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 29.9, "score": 5.75}, {"file": "audio/p1_evolink-suno-v6_2.mp3", "key": "evolink-suno-v6", "name": "Suno V6", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 30.0, "score": 6.25}, {"file": "audio/p1_lyria-3.5_1.mp3", "key": "lyria-3.5", "name": "Google Lyria 3.5", "via": "fal / Gemini API", "price": "$0.10/首 (fal)", "dur": 63.9, "score": 5.25}, {"file": "audio/p1_mureka-9.5_1.mp3", "key": "mureka-9.5", "name": "Mureka 9.5", "via": "fal", "price": "单价未核实", "dur": 188.9, "score": 5.84}, {"file": "audio/p1_seed-audio_1.mp3", "key": "seed-audio", "name": "Seed Audio 1.0", "via": "EvoLink（现用）", "price": "≈$0.09/30s", "dur": 30.0, "score": 4.42}, {"file": "audio/p1_stable-audio-3_1.mp3", "key": "stable-audio-3", "name": "Stable Audio 3 Medium", "via": "fal", "price": "$0.04/首", "dur": 30.0, "score": 5.0}, {"file": "audio/p1_suno-v6_1.mp3", "key": "suno-v6", "name": "Suno V6", "via": "sunoapi.org", "price": "$0.06/次·2 首", "dur": 30.8, "score": 5.29}, {"file": "audio/p1_suno-v6_2.mp3", "key": "suno-v6", "name": "Suno V6", "via": "sunoapi.org", "price": "$0.06/次·2 首", "dur": 29.2, "score": 5.58}, {"file": "audio/p1b_minimax-music-3_1.wav", "key": "minimax-music-3", "name": "MiniMax Music 3", "via": "fal", "price": "$0.06/30s", "dur": 30.0, "score": 3.92}]}, "p2": {"title": "Prompt 2 · 国风史诗预告", "prompt": "Epic Chinese-style cinematic music for a 30-second fantasy short film trailer: guzheng and erhu melody over taiko drums and a full string orchestra, mysterious opening, rising tension, powerful climax around 20 seconds, resolved final hit. Instrumental, no vocals, 90 BPM.", "tracks": [{"file": "audio/p2_elevenlabs-v2.5_1.mp3", "key": "elevenlabs-v2.5", "name": "ElevenLabs Music v2.5", "via": "fal", "price": "$0.30/30s (fal)", "dur": 30.0, "score": 5.5}, {"file": "audio/p2_evolink-suno-v6_1.mp3", "key": "evolink-suno-v6", "name": "Suno V6", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 29.2, "score": 5.17}, {"file": "audio/p2_evolink-suno-v6_2.mp3", "key": "evolink-suno-v6", "name": "Suno V6", "via": "EvoLink", "price": "$0.118/次·2 首", "dur": 28.8, "score": 5.91}, {"file": "audio/p2_lyria-3.5_1.mp3", "key": "lyria-3.5", "name": "Google Lyria 3.5", "via": "fal / Gemini API", "price": "$0.10/首 (fal)", "dur": 67.2, "score": 4.58}, {"file": "audio/p2_minimax-music-3_1.wav", "key": "minimax-music-3", "name": "MiniMax Music 3", "via": "fal", "price": "$0.06/30s", "dur": 30.0, "score": 3.92}, {"file": "audio/p2_mureka-9.5_1.mp3", "key": "mureka-9.5", "name": "Mureka 9.5", "via": "fal", "price": "单价未核实", "dur": 195.7, "score": 4.5}, {"file": "audio/p2_seed-audio_1.mp3", "key": "seed-audio", "name": "Seed Audio 1.0", "via": "EvoLink（现用）", "price": "≈$0.09/30s", "dur": 30.0, "score": 5.92}, {"file": "audio/p2_stable-audio-3_1.mp3", "key": "stable-audio-3", "name": "Stable Audio 3 Medium", "via": "fal", "price": "$0.04/首", "dur": 30.0, "score": 5.08}, {"file": "audio/p2_suno-v6_1.mp3", "key": "suno-v6", "name": "Suno V6", "via": "sunoapi.org", "price": "$0.06/次·2 首", "dur": 28.7, "score": 6.0}, {"file": "audio/p2_suno-v6_2.mp3", "key": "suno-v6", "name": "Suno V6", "via": "sunoapi.org", "price": "$0.06/次·2 首", "dur": 29.2, "score": 6.04}]}};
const L='ABCDEFGHIJ';
function render(){const root=document.getElementById('root');root.innerHTML='';
for(const [tag,v] of Object.entries(DATA)){const h=document.createElement('h2');h.textContent=v.title;root.appendChild(h);
const p=document.createElement('div');p.className='prompt';p.textContent=v.prompt;root.appendChild(p);
const ts=[...v.tracks].sort(()=>Math.random()-.5);
ts.forEach((t,i)=>{const r=document.createElement('div');r.className='row';const k='score_'+t.file;
r.innerHTML=`<div class="lab">${L[i]}</div><div><span class="blind">样本 ${L[i]} · ${t.dur}s</span><span class="name">${t.name}</span> <span class="meta mut">· ${t.via} · ${t.dur}s · ${t.price} · Gemini ${t.score??'-'}/10</span><br><select data-k="${k}"><option value="">我的评分</option>${[5,4,3,2,1].map(n=>`<option ${localStorage[k]==n?'selected':''}>${n}</option>`).join('')}</select></div><audio controls preload="none" src="${t.file}"></audio>`;
root.appendChild(r)})}
root.querySelectorAll('select').forEach(s=>s.onchange=()=>localStorage[s.dataset.k]=s.value);
root.querySelectorAll('audio').forEach(a=>a.onplay=()=>root.querySelectorAll('audio').forEach(b=>b!==a&&b.pause()))}
document.getElementById('tog').onclick=e=>{const r=document.getElementById('root');r.classList.toggle('hide');e.target.textContent=r.classList.contains('hide')?'揭晓供应商':'隐藏供应商'};
document.getElementById('shuf').onclick=render;render();
</script></main></body></html>
